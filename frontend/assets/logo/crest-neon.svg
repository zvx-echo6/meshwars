<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MeshWars">
  <title>MeshWars</title>
  <!-- Neon-skin crest. Geometric on purpose: the gold crest is a painted
       heraldic mark, and a traced imitation of it in cyan would read as a
       worse copy. This is the same idea drawn the way the skin talks -
       a shield, a mesh of nodes inside it, one node lit. Pure shapes, so
       it stays legible at the 28px the nav bar renders it at. -->
  <defs>
    <linearGradient id="mw-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DFDF6"/>
      <stop offset="1" stop-color="#2BE8E0"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M32 3 L57 12 v22 c0 13-11 22-25 27 C18 56 7 47 7 34 V12 Z"
        fill="#08202B" stroke="url(#mw-edge)" stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- mesh links -->
  <g stroke="#2BE8E0" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
    <path d="M32 16 L18 26 M32 16 L46 26 M18 26 L24 43 M46 26 L40 43 M24 43 L40 43 M18 26 L46 26 M32 16 L32 30 M24 43 L32 30 M40 43 L32 30"/>
  </g>

  <!-- nodes -->
  <g fill="#9DFDF6">
    <circle cx="18" cy="26" r="2.6"/>
    <circle cx="46" cy="26" r="2.6"/>
    <circle cx="24" cy="43" r="2.6"/>
    <circle cx="40" cy="43" r="2.6"/>
    <circle cx="32" cy="16" r="2.6"/>
  </g>

  <!-- the one that is transmitting -->
  <circle cx="32" cy="30" r="5" fill="#05080D" stroke="#9DFDF6" stroke-width="2"/>
  <circle cx="32" cy="30" r="1.8" fill="#9DFDF6"/>
</svg>
