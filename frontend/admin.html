<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MeshWars &mdash; Admin</title>
  <style>
    /* Matches the existing dark theme (see frontend/join.css) --
       self-contained, no external fonts, libraries, or CDN assets. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0a0a0a;
      color: #ddd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .admin-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .admin-header h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0.02em;
      color: #e8a735;
    }

    .admin-tagline {
      margin: 0 0 20px;
      color: #aaa;
      font-size: 13px;
    }

    .admin-panel {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .admin-panel-title {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e8a735;
      margin-bottom: 10px;
    }

    .admin-token-row {
      display: flex;
      gap: 8px;
    }

    .admin-token-row input {
      flex: 1;
      min-width: 0;
      background: #0a0a0a;
      color: #ddd;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .admin-token-row input:focus {
      outline: none;
      border-color: #e8a735;
    }

    .admin-btn {
      background: #2a2a2a;
      color: #e8a735;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .admin-btn:hover { background: #333; }
    .admin-btn:disabled { opacity: 0.5; cursor: default; }

    .admin-btn-danger {
      color: #f08080;
      border-color: #663333;
    }

    /* Delete is permanent, unlike revoke (a key) or disable (reversible) --
       filled solid red rather than outlined, so it cannot be mistaken for
       either at a glance or hit by accident. */
    .admin-btn-delete {
      background: #5a1f1f;
      color: #ffd6d6;
      border-color: #7a2b2b;
    }
    .admin-btn-delete:hover {
      background: #6e2626;
    }

    .admin-player-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .admin-delete-result {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 10px;
      display: none;
    }
    .admin-delete-result div {
      padding: 1px 0;
    }

    /* A raw key only ever appears here once -- same one-time treatment
       frontend/join.js gives a key at signup. Styled like a warning, not
       a plain result box (thicker red border, tinted background), since
       missing it here means going back to this same button to mint yet
       another one and revoke this one too. */
    .admin-reissue-result {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
      background: #2a1414;
      border: 2px solid #7a2b2b;
      border-radius: 4px;
      padding: 10px 12px;
      display: none;
    }
    .admin-reissue-result strong {
      display: block;
      color: #ffb088;
      margin-bottom: 6px;
    }
    .admin-reissue-key {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 6px 8px;
      margin: 6px 0;
      font-size: 12px;
      color: #ffd6d6;
      word-break: break-all;
    }

    .admin-status {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
    .admin-status-error {
      color: #f08080;
    }

    .admin-hint {
      font-size: 11px;
      color: #888;
      margin: 6px 0 0;
    }

    .admin-player-card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .admin-player-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .admin-player-name {
      font-size: 14px;
      font-weight: 700;
      color: #eee;
    }

    .admin-team-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #888;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 2px 6px;
    }

    .admin-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 3px;
      padding: 2px 6px;
    }
    .admin-badge-ok {
      color: #7fdc7f;
      border: 1px solid #2e5e2e;
    }
    .admin-badge-bad {
      color: #f08080;
      border: 1px solid #663333;
    }

    .admin-player-meta {
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }

    .admin-key-hash {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      color: #ccc;
    }

    .admin-keys {
      margin: 8px 0;
    }

    .admin-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #aaa;
      padding: 4px 0;
      border-top: 1px solid #222;
    }
    .admin-key-row:first-child {
      border-top: none;
    }
    .admin-key-row .admin-btn {
      margin-left: auto;
      padding: 4px 10px;
    }

    .admin-empty {
      font-size: 13px;
      color: #888;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <main class="admin-wrap">

    <header class="admin-header">
      <h1>MeshWars Admin</h1>
      <p class="admin-tagline">Revoke keys and disable players.</p>
    </header>

    <section class="admin-panel">
      <div class="admin-panel-title">Admin token</div>
      <div class="admin-token-row">
        <input type="password" id="token-input" autocomplete="off" placeholder="paste admin token" />
        <button type="button" id="load-btn" class="admin-btn">Load</button>
      </div>
      <p class="admin-hint">Kept in this page's memory only for this session &mdash; never stored, never sent anywhere but this page's own requests.</p>
      <div id="status" class="admin-status"></div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-title">Players</div>
      <div id="players"></div>
      <div id="delete-result" class="admin-delete-result"></div>
      <div id="reissue-result" class="admin-reissue-result"></div>
    </section>

  </main>

  <script>
'use strict';

// Admin token lives only in this variable, for this page load. Never
// written to localStorage/sessionStorage/cookies, never logged.
let adminToken = '';

var els = {
  tokenInput: document.getElementById('token-input'),
  loadBtn: document.getElementById('load-btn'),
  status: document.getElementById('status'),
  players: document.getElementById('players'),
  deleteResult: document.getElementById('delete-result'),
  reissueResult: document.getElementById('reissue-result'),
};

function setStatus(msg, isError) {
  els.status.textContent = msg;
  els.status.className = isError ? 'admin-status admin-status-error' : 'admin-status';
}

function fmtTs(ts) {
  if (ts === null || ts === undefined) return '—';
  try {
    return new Date(ts * 1000).toLocaleString();
  } catch (e) {
    return String(ts);
  }
}

// player_node.node_ref is always stored bare lowercase 8-hex (see
// app/node_ref.py) -- render it back in whichever form that radio's
// own ecosystem uses, same as frontend/join.js's displayNodeRef():
// '!a1b2c3d4' for Meshtastic, bare for MeshCore (how MeshMapper shows
// a contact key). Display-only.
function displayNodeRef(protocol, nodeRef) {
  return protocol === 'mt' ? ('!' + nodeRef) : nodeRef;
}

// Small DOM-builder helper. Every dynamic value below goes through
// .textContent (or is a literal className we wrote ourselves) --
// nothing attacker-controlled (player names, key prefixes, radio ids)
// is ever assigned via innerHTML.
function el(tag, opts) {
  var node = document.createElement(tag);
  opts = opts || {};
  if (opts.text !== undefined) node.textContent = opts.text;
  if (opts.className) node.className = opts.className;
  return node;
}

async function apiCall(path, options) {
  var opts = options || {};
  var headers = Object.assign({}, opts.headers || {}, { 'X-Admin-Token': adminToken });
  var resp = await fetch(path, Object.assign({}, opts, { headers: headers }));
  var body = null;
  try { body = await resp.json(); } catch (e) { /* no body */ }
  if (!resp.ok) {
    var msg = (body && body.error) ? body.error : ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return body;
}

function renderKey(key) {
  var row = el('div', { className: 'admin-key-row' });
  row.appendChild(el('span', { className: 'admin-key-hash', text: key.key_hash_prefix }));
  row.appendChild(el('span', { text: 'issued ' + fmtTs(key.issued_at) }));
  row.appendChild(el('span', { text: 'last used ' + fmtTs(key.last_seen_at) }));
  row.appendChild(el('span', {
    className: key.revoked ? 'admin-badge admin-badge-bad' : 'admin-badge admin-badge-ok',
    text: key.revoked ? 'revoked' : 'active',
  }));
  if (!key.revoked) {
    var btn = el('button', { className: 'admin-btn admin-btn-danger', text: 'Revoke' });
    btn.type = 'button';
    btn.addEventListener('click', function () { revokeKey(key.key_hash_prefix, btn); });
    row.appendChild(btn);
  }
  return row;
}

async function revokeKey(prefix, btn) {
  btn.disabled = true;
  try {
    await apiCall('/api/admin/revoke', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key_hash_prefix: prefix }),
    });
    setStatus('Revoked key ' + prefix, false);
    await loadPlayers();
  } catch (e) {
    setStatus('Revoke failed: ' + e.message, true);
    btn.disabled = false;
  }
}

async function togglePlayer(player, btn) {
  btn.disabled = true;
  var path = player.disabled ? '/api/admin/player/enable' : '/api/admin/player/disable';
  try {
    await apiCall(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: player.player_id }),
    });
    setStatus((player.disabled ? 'Enabled ' : 'Disabled ') + player.display_name, false);
    await loadPlayers();
  } catch (e) {
    setStatus('Update failed: ' + e.message, true);
    btn.disabled = false;
  }
}

// Table names in the order the server reports them, paired with a plain
// English label -- the operator sees consequences, not raw JSON keys.
var DELETE_COUNT_LABELS = [
  ['player', 'player record'],
  ['api_key', 'API key(s)'],
  ['player_node', 'radio binding(s)'],
  ['player_cell_ping', 'location ping(s)'],
  ['player_ingest_stat', 'ingest stat row(s)'],
  ['mc_tile_unique_painter', 'unique-painter credit(s)'],
  ['mc_tile', 'square(s) they held'],
  ['mc_tile_score', 'square score row(s)'],
  ['mc_tile_capture', 'square capture-window row(s)'],
  ['mc_tile_capture_log', 'square capture-log entrie(s)'],
];

function renderDeleteResult(displayName, counts) {
  var container = els.deleteResult;
  container.replaceChildren();
  var title = el('div', { text: 'Deleted ' + displayName + ':' });
  title.style.fontWeight = '700';
  title.style.marginBottom = '4px';
  container.appendChild(title);
  DELETE_COUNT_LABELS.forEach(function (pair) {
    var key = pair[0], label = pair[1];
    var n = counts && typeof counts[key] === 'number' ? counts[key] : 0;
    container.appendChild(el('div', { text: n + ' ' + label }));
  });
  container.style.display = 'block';
}

// Shown exactly once, same as a key at signup (frontend/join.js) --
// this container is not cleared until the next reissue overwrites it,
// so it stays visible after loadPlayers() re-renders the player cards
// below it (that reload replaces #players entirely, but never touches
// #reissue-result).
function renderReissueResult(displayName, key, revokedCount) {
  var container = els.reissueResult;
  container.replaceChildren();
  container.appendChild(el('strong', {
    text: 'New key for ' + displayName + ' -- this is the only time it will be shown.',
  }));
  container.appendChild(el('span', { className: 'admin-reissue-key', text: key }));
  container.appendChild(el('div', {
    text: revokedCount > 0
      ? ('Revoked ' + revokedCount + ' prior key(s) for this player -- those stop working immediately.')
      : 'This player had no active keys before -- nothing else was revoked.',
  }));
  container.style.display = 'block';
}

async function reissuePlayer(player, btn) {
  var typed = window.prompt(
    'Type "' + player.display_name + '" exactly to reissue this player\'s key. ' +
    'Every key they currently hold stops working the moment the new one is issued.'
  );
  if (typed === null) return; // cancelled
  if (typed.length === 0) return; // nothing entered, do not send the request

  btn.disabled = true;
  try {
    var result = await apiCall('/api/admin/player/reissue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: player.player_id, display_name: typed }),
    });
    setStatus('Reissued key for ' + player.display_name, false);
    renderReissueResult(player.display_name, result.key, result.revoked_count);
    await loadPlayers();
  } catch (e) {
    setStatus('Reissue failed: ' + e.message, true);
    btn.disabled = false;
  }
}

async function deletePlayer(player, btn) {
  var typed = window.prompt(
    'Type "' + player.display_name + '" exactly to permanently delete this player. ' +
    'This removes their account, keys, radios, and every square they hold. This cannot be undone.'
  );
  if (typed === null) return; // cancelled
  if (typed.length === 0) return; // nothing entered, do not send the request

  btn.disabled = true;
  try {
    var result = await apiCall('/api/admin/player/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: player.player_id, display_name: typed }),
    });
    setStatus('Deleted ' + player.display_name, false);
    renderDeleteResult(player.display_name, result.counts);
    await loadPlayers();
  } catch (e) {
    setStatus('Delete failed: ' + e.message, true);
    btn.disabled = false;
  }
}

function renderPlayer(player) {
  var card = el('div', { className: 'admin-player-card' });

  var header = el('div', { className: 'admin-player-header' });
  header.appendChild(el('span', { className: 'admin-player-name', text: player.display_name }));
  header.appendChild(el('span', { className: 'admin-team-tag', text: player.team }));
  if (player.disabled) {
    header.appendChild(el('span', { className: 'admin-badge admin-badge-bad', text: 'disabled' }));
  }
  card.appendChild(header);

  card.appendChild(el('div', { className: 'admin-player-meta', text: 'joined ' + fmtTs(player.created_at) }));

  if (player.radios && player.radios.length) {
    var radios = el('div', { className: 'admin-player-meta' });
    radios.appendChild(document.createTextNode('radios: '));
    player.radios.forEach(function (r, i) {
      if (i > 0) radios.appendChild(document.createTextNode(', '));
      radios.appendChild(el('span', { className: 'admin-key-hash', text: r.protocol + ':' + displayNodeRef(r.protocol, r.node_ref) }));
    });
    card.appendChild(radios);
  }

  var keysWrap = el('div', { className: 'admin-keys' });
  if (!player.keys || player.keys.length === 0) {
    keysWrap.appendChild(el('div', { className: 'admin-player-meta', text: 'no keys' }));
  } else {
    player.keys.forEach(function (k) { keysWrap.appendChild(renderKey(k)); });
  }
  card.appendChild(keysWrap);

  var toggleBtn = el('button', {
    className: 'admin-btn',
    text: player.disabled ? 'Enable player' : 'Disable player',
  });
  toggleBtn.type = 'button';
  toggleBtn.addEventListener('click', function () { togglePlayer(player, toggleBtn); });

  var reissueBtn = el('button', {
    className: 'admin-btn admin-btn-danger',
    text: 'Reissue key',
  });
  reissueBtn.type = 'button';
  reissueBtn.addEventListener('click', function () { reissuePlayer(player, reissueBtn); });

  var deleteBtn = el('button', {
    className: 'admin-btn admin-btn-delete',
    text: 'Delete player',
  });
  deleteBtn.type = 'button';
  deleteBtn.addEventListener('click', function () { deletePlayer(player, deleteBtn); });

  var actions = el('div', { className: 'admin-player-actions' });
  actions.appendChild(toggleBtn);
  actions.appendChild(reissueBtn);
  actions.appendChild(deleteBtn);
  card.appendChild(actions);

  return card;
}

async function loadPlayers() {
  setStatus('Loading...', false);
  try {
    var players = await apiCall('/api/admin/players');
    els.players.replaceChildren();
    if (!players.length) {
      els.players.appendChild(el('div', { className: 'admin-empty', text: 'no players registered' }));
    } else {
      players.forEach(function (p) { els.players.appendChild(renderPlayer(p)); });
    }
    setStatus('Loaded ' + players.length + ' player(s)', false);
  } catch (e) {
    setStatus('Load failed: ' + e.message, true);
  }
}

els.loadBtn.addEventListener('click', function () {
  adminToken = els.tokenInput.value;
  loadPlayers();
});
els.tokenInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    adminToken = els.tokenInput.value;
    loadPlayers();
  }
});
  </script>
</body>
</html>
