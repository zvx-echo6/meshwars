<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>MeshWars</title>
</head>
<body style="margin:0; padding:0; background-color:#0C0B0A;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0C0B0A; margin:0; padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#0C0B0A;">
        <tr>
          <td align="center" style="padding:0 0 24px 0;">
            <img src="cid:{logo_cid}" width="240" alt="MeshWars" style="display:block; border:0; outline:none; text-decoration:none; width:240px; max-width:240px;">
          </td>
        </tr>
        <tr>
          <td style="padding:0 24px;">
            <h1 style="margin:0 0 16px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:22px; line-height:28px; font-weight:bold; color:#EDD39F; text-align:center;">{heading}</h1>
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:15px; line-height:22px; color:#dddddd; text-align:center;">{body}</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 24px 0 24px;">
            {cta}
          </td>
        </tr>
        <tr>
          <td style="padding:28px 24px 0 24px;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:18px; color:#888888; text-align:center;">{footer}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 24px 32px 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-top:1px solid #333333; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
            </table>
            <p style="margin:16px 0 0 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:16px; color:#888888; text-align:center;">meshwars.com</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
