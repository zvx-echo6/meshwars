  events send_security_notice() sends (a password change, a role

  file. So every section below is itself a placeholder --
  {heading}/{line1}/{line2}/{line3}/{cta_label}/{cta_url}/{footer} --

  last, against the fully-assembled page" reasoning {link_url} already
  gets in sign_in.html/verify_contact.html (see that file's own
  comment): {cta_url} appears twice below (the button href and the
  plaintext fallback under it), and one substitution has to cover both.
-->

    </td>
