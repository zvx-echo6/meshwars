<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0B0A" />
  <!-- Applied before any stylesheet paints, so a reader who chose the
       neon skin never sees a frame of gold first. Deliberately inline
       and tiny: a fetched script here would block first paint, which is
       the thing this exists to avoid. Mirrors theme-toggle.js, which
       owns everything after load. -->
  <script>
    try { if (localStorage.getItem('mwTheme') === 'neon') {
      document.documentElement.setAttribute('data-theme', 'neon');
    } } catch (e) {}
  </script>
  <title>MeshWars — Live Territory Map</title>
  <meta name="description" content="MeshWars is a live mesh map: a real-world capture-the-flag game where seven teams claim ground on Meshtastic and MeshCore mesh coverage.">
  <link rel="canonical" href="https://meshwars.com/">

  <!-- Google reads a site's search-results favicon from the home page
       specifically, and documents it must be square and a multiple of
       48px (48/96/144/192...) -- it is unreliable about anything smaller,
       so the 16/32px pair below is for browser tabs only. 48x48 and
       192x192 are already on disk (see frontend/assets/favicon/) and
       declared here for Google; do not remove the smaller sizes, browsers
       still use those. -->
  <link rel="icon" href="/static/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/assets/favicon/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/assets/favicon/android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/static/assets/site.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:title" content="MeshWars — Live Territory Map">
  <meta property="og:description" content="Watch seven teams compete for real-world territory over mesh radio, live on the map.">
  <meta property="og:url" content="https://meshwars.com/">
  <meta property="og:image" content="https://meshwars.com/static/assets/social/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MeshWars — Live Territory Map">
  <meta name="twitter:description" content="Watch seven teams compete for real-world territory over mesh radio, live on the map.">
  <meta name="twitter:image" content="https://meshwars.com/static/assets/social/twitter-card.png">

  <!-- Truthful and minimal: describes the game and links to the actual
       open-source repo it runs from. No invented ratings, prices,
       authorship, or organization -- none of those exist for this
       project. Same content (page-specific "url") on all three public
       pages; see frontend/about.html and frontend/join.html. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Game",
    "name": "MeshWars",
    "url": "https://meshwars.com/",
    "description": "A real-world capture-the-flag game played over mesh radio. Seven teams claim map squares by reaching Meshtastic or MeshCore mesh coverage from them.",
    "genre": ["Location-based game", "Capture the flag"],
    "isBasedOn": {
      "@type": "SoftwareSourceCode",
      "name": "MeshWars",
      "codeRepository": "https://github.com/zvx-echo6/meshwars",
      "programmingLanguage": "Python",
      "license": "https://opensource.org/licenses/MIT"
    }
  }
  </script>

  <!-- Cache-busting: /static assets are served cacheable while these HTML
       pages are no-cache. Without a version string, a returning visitor can get
       fresh HTML paired with a stale cached stylesheet/script. Bump v=20260820-1 on
       EVERY /static CSS/JS reference on this page whenever any of those files
       change -- do not touch the pinned external Leaflet CDN links. -->
  <link rel="stylesheet" href="/static/theme.css?v=20260823-13" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/coverage.css?v=20260823-13" />
  <link rel="stylesheet" href="/static/mc.css?v=20260823-13" />
</head>
<body>

  <nav class="mw-nav">
    <a href="/" class="mw-nav-brand"><span class="mw-nav-crest" role="img" aria-label="MeshWars crest"></span>MeshWars</a>
    <div class="mw-nav-links">
      <a href="/" class="active">Map</a>
      <a href="/results">Results</a>
      <a href="/rules">Rules</a>
      <a href="/about">About</a>
      <a href="/join">Join</a>
      <button type="button" id="mw-theme-btn" class="mw-theme-btn" aria-pressed="false" title="Switch to the neon theme" aria-label="Switch to the neon theme">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 1.6a6.4 6.4 0 1 0 0 12.8A6.4 6.4 0 0 0 8 1.6zm0 1.5v9.8a4.9 4.9 0 0 1 0-9.8z"/></svg>
      </button>
      <a href="https://github.com/zvx-echo6/meshwars" class="mw-nav-github" target="_blank" rel="noopener noreferrer" aria-label="MeshWars on GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0c-4.42 0-8 3.58-8 8a8.013 8.013 0 0 0 5.47 7.59c.4.08.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </nav>

  <!-- This page is a Leaflet map with essentially no indexable text --
       with JavaScript off (a crawler, or a person who disabled it) this
       is the only content anyone gets. Genuinely descriptive, not
       cloaking: it says exactly what the page shows when JS is running.
       See .mw-noscript in coverage.css for why it needs position:fixed
       and a z-index above #loading-overlay's -- that overlay never
       fades without mc.js running to add its .fade-out class. -->
  <noscript>
    <div class="mw-noscript">
      <p>MeshWars is a real-world capture-the-flag game played over mesh radio. Seven teams claim roughly 300 meter map squares by reaching Meshtastic or MeshCore mesh coverage from them; this page normally shows a live map of who holds what. Enable JavaScript to see it, or read more on the <a href="/about">About page</a>.</p>
    </div>
  </noscript>

  <!-- Built once here (not by mc.js at runtime, unlike the History/Roster/
       Top modal -- this has no interactive chrome to wire up, just content
       mc.js swaps in/out) -- see mc.js's refreshWinnerBanner and mc.css's
       .mc-winner-banner. Same element, same position, on both boards. -->
  <div id="mc-winner-banner" class="mc-winner-banner"></div>

  <div id="map"></div>

  <div id="loading-overlay">
    <div class="loading-inner">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading map…</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>

  <!-- frontend/code.js (the retired Meshtastic geohash-tile renderer:
       color palettes, Territory Mode toggle, sample dots) is gone -- see
       mc.js's module docstring. mc.js now owns map bootstrapping and
       renders both boards; its own modal (built at runtime, not markup
       here) replaces the #mt-history-modal shell that used to live in
       this file. -->
  <script src="/static/mc.js?v=20260823-13" type="module"></script>
  <script src="/static/theme-toggle.js?v=20260823-13" type="module"></script>
</body>
</html>
