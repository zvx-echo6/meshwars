  <meta name="theme-color" content="#0C0B0A" />
  <!-- Applied before any stylesheet paints, so a reader who chose the
       neon skin never sees a frame of gold first. Deliberately inline
       and tiny: a fetched script here would block first paint, which is
       the thing this exists to avoid. Mirrors theme-toggle.js, which
       owns everything after load. -->
  <script>
    try { if (localStorage.getItem('mwTheme') === 'neon') {
      document.documentElement.setAttribute('data-theme', 'neon');
    } } catch (e) {}
  </script>
  <title>MeshWars — Confirm Email</title>
  <!-- Reached only by redirect from GET /auth/contact-email/verify
       (app/oauth_api.py's contact_email_verify()) -- never a
       destination anyone links to or is meant to land on directly.
       noindex, and no canonical/OG/JSON-LD -- there is nothing here
       worth a search result or a social card. Same reasoning
       frontend/link.html's own head gives for the same kind of page. -->
  <meta name="robots" content="noindex">

       "license" field; this page has no JSON-LD (see above), so it's

       the complete source, satisfying AGPL section 13 on this page the
       same as every other. -->
