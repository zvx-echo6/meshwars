services:
  meshwars:
    build: .
    image: meshwars:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # Required: point this at any meshview instance
      MESHVIEW_BASE_URL: "${MESHVIEW_BASE_URL}"
      # Optional overrides
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-45}"
      SEASON_DAYS: "${SEASON_DAYS:-30}"
      WINNER_BANNER_HOURS: "${WINNER_BANNER_HOURS:-72}"
      HISTORY_MAX: "${HISTORY_MAX:-12}"
      MAX_HOPS: "${MAX_HOPS:-1}"
      BACKFILL_HOURS: "${BACKFILL_HOURS:-24}"
      PLAY_AREA_NORTH: "${PLAY_AREA_NORTH:-44.10}"
      PLAY_AREA_SOUTH: "${PLAY_AREA_SOUTH:-40.20}"
      PLAY_AREA_WEST: "${PLAY_AREA_WEST:--117.00}"
      PLAY_AREA_EAST: "${PLAY_AREA_EAST:--111.60}"
      JOIN_INVITE_CODE: "${JOIN_INVITE_CODE:-}"
      JOIN_RATE_LIMIT_ATTEMPTS: "${JOIN_RATE_LIMIT_ATTEMPTS:-5}"
      JOIN_RATE_LIMIT_WINDOW_SECONDS: "${JOIN_RATE_LIMIT_WINDOW_SECONDS:-600}"
      PUBLIC_HOST: "${PUBLIC_HOST:-meshwars.com}"
      MC_RAW_LOG_ENABLED: "${MC_RAW_LOG_ENABLED:-false}"
      MC_RAW_LOG_PATH: "${MC_RAW_LOG_PATH:-/data/mc_raw.log}"
    volumes:
      - meshwars-data:/data

volumes:
  meshwars-data:
