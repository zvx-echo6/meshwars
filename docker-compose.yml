# ---- web/worker role split -------------------------------------------
#
# One image (`meshwars:latest`, built once from the same Dockerfile),
# run as two services against the SAME SQLite file (./data/data/game.db,
# both services mount identical volumes below) and the SAME image:
#
#   meshwars         -- web role. HTTP only: `--workers 3` uvicorn
#                        processes serving every route, including
#                        POST /api/mc/ingest (which just enqueues a row
#                        into the durable mc_ingest_queue table and
#                        returns -- see app/mc_ingest.py's module
#                        docstring). Published on 8090, exactly as
#                        before this split -- mw-deploy polls /health
#                        there and nothing about that changes.
#                        RUN_BACKGROUND_TASKS=false (app/config.py):
#                        starts none of app/main.py's background loops
#                        and performs none of app/db.py init_db()'s
#                        startup writes (the places-seed thread, the
#                        checkin/freqmapper/discord config bootstraps).
#
#   meshwars-worker   -- worker role. Exactly ONE process (the
#                        Dockerfile's default CMD, no --workers), no
#                        published port -- it serves no external
#                        traffic. RUN_BACKGROUND_TASKS=true: this is
#                        the ONE process in the whole deployment that
#                        owns every background loop (ingest, mc_ingest's
#                        queue-drain worker, freqmapper_ingest, the
#                        checkin poller, the mqtt subscriber, and the
#                        Discord outbox drain loop) and performs the
#                        startup writes above. Its own /health stays
#                        reachable inside the container on the same
#                        internal port 8090 the image always listens
#                        on -- the Dockerfile's own HEALTHCHECK already
#                        curls localhost:8090/health, so nothing extra
#                        is needed here for that to keep working; it
#                        simply isn't published to the host.
#
# Exactly one process across the two services has RUN_BACKGROUND_TASKS
# true -- see that setting's own comment in app/config.py for what goes
# wrong if that is ever more or less than one.
#
# The rest of this file's environment variables are IDENTICAL between
# the two services (both roles need every setting -- e.g. the worker
# needs DISCORD_BOT_TOKEN to run role sync, the web role needs it to
# render whatever reads discord_config back) and are factored into the
# x-meshwars-environment anchor below purely to avoid maintaining two
# copies of the same ~70-line block; RUN_BACKGROUND_TASKS is the only
# key each service's own `environment:` overrides. Same reasoning for
# x-meshwars-volumes: both services must see the exact same game.db.

x-meshwars-environment: &meshwars-environment
  # Required: point this at any meshview instance
  MESHVIEW_BASE_URL: "${MESHVIEW_BASE_URL}"
  # Optional overrides
  # Reverse-proxy trust for accurate per-caller rate limiting (see
  # app/client_ip.py and TRUSTED_PROXIES' own comment in
  # app/config.py). Empty means every request is treated as coming
  # straight from request.client.host with no X-Forwarded-For
  # trusted at all -- correct but not useful behind a reverse proxy,
  # which is every real deployment. Set this to your reverse proxy's
  # real address (comma-separated IPs and/or CIDR ranges are both
  # accepted) once it's known. FORWARDED_ALLOW_IPS is the matching
  # knob one layer down, for uvicorn's own --proxy-headers handling
  # (see the Dockerfile CMD) -- set both to the same value.
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
  POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-45}"
  SEASON_DAYS: "${SEASON_DAYS:-180}"
  WINNER_BANNER_HOURS: "${WINNER_BANNER_HOURS:-72}"
  HISTORY_MAX: "${HISTORY_MAX:-12}"
  MAX_HOPS: "${MAX_HOPS:-0}"
  BACKFILL_HOURS: "${BACKFILL_HOURS:-24}"
  # Places Worth Going seed operator override -- see .env.example.
  # Defaults false; forces a full reload on the next boot regardless
  # of the seed's recorded fingerprint.
  PLACES_FORCE_RESEED: "${PLACES_FORCE_RESEED:-false}"
  PLAY_AREA_NORTH: "${PLAY_AREA_NORTH:-44.10}"
  PLAY_AREA_SOUTH: "${PLAY_AREA_SOUTH:-40.20}"
  PLAY_AREA_WEST: "${PLAY_AREA_WEST:--117.00}"
  PLAY_AREA_EAST: "${PLAY_AREA_EAST:--111.60}"
  JOIN_INVITE_CODE: "${JOIN_INVITE_CODE:-}"
  JOIN_INVITE_CODE_PUBLIC: "${JOIN_INVITE_CODE_PUBLIC:-false}"
  JOIN_RATE_LIMIT_ATTEMPTS: "${JOIN_RATE_LIMIT_ATTEMPTS:-5}"
  JOIN_RATE_LIMIT_WINDOW_SECONDS: "${JOIN_RATE_LIMIT_WINDOW_SECONDS:-600}"
  JOIN_MESHTASTIC_ENABLED: "${JOIN_MESHTASTIC_ENABLED:-false}"
  PUBLIC_HOST: "${PUBLIC_HOST:-meshwars.com}"
  GOOGLE_SITE_VERIFICATION: "${GOOGLE_SITE_VERIFICATION:-}"
  ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
  # Whether the admin surface (/admin, /api/admin/*) requires a
  # session/role/TOTP at all, or is wide open to anyone who can reach
  # the port. True is correct for every real deployment -- leave it
  # alone there. Named here for the same reason as
  # ACCOUNT_SESSION_COOKIE_SECURE just below: a preview box needs to
  # turn it off from its own (gitignored) .env, and without a
  # passthrough here the container never sees the value at all (the
  # image COPYs only requirements.txt, app/ and frontend/, so
  # pydantic's env_file=".env" resolves to nothing inside it). Preview's
  # database is periodically re-cloned from production, wiping every
  # account, session, and TOTP row, which would otherwise leave that
  # box's admin panel permanently unreachable after every clone -- see
  # app/config.py's admin_require_auth comment for the full reasoning.
  # Defaults true: a normal deploy is unchanged.
  ADMIN_REQUIRE_AUTH: "${ADMIN_REQUIRE_AUTH:-true}"
  # Preview hosts only -- renders the month in progress on /results,
  # which production deliberately does not do. Defaults false, so
  # naming it here changes nothing for a normal deploy; it exists so
  # a preview box can turn it on from its own (gitignored) .env
  # instead of hand-editing this file, where a deploy would wipe it.
  RESULTS_PREVIEW_CURRENT_MONTH: "${RESULTS_PREVIEW_CURRENT_MONTH:-false}"
  # Secure flag on the session cookie. True is correct for every
  # deployment reached over https, which is every real one -- leave it
  # alone there. Named here for the same reason as
  # RESULTS_PREVIEW_CURRENT_MONTH above: a preview box needs to turn it
  # off from its own (gitignored) .env, and without a passthrough here
  # the container never sees the value at all (the image COPYs only
  # requirements.txt, app/ and frontend/, so pydantic's env_file=".env"
  # resolves to nothing inside it). Preview's /admin is 404'd on its
  # public host by design and is reached over the tailnet on plain
  # http, where a browser silently DISCARDS a Secure cookie -- you can
  # sign in, get a valid session, and still arrive logged out, with no
  # error anywhere. The session still rides WireGuard, so it is not
  # travelling in the clear. Defaults true: a normal deploy is unchanged.
  ACCOUNT_SESSION_COOKIE_SECURE: "${ACCOUNT_SESSION_COOKIE_SECURE:-true}"
  MC_RAW_LOG_ENABLED: "${MC_RAW_LOG_ENABLED:-false}"
  MC_RAW_LOG_PATH: "${MC_RAW_LOG_PATH:-/data/mc_raw.log}"
  # MeshCore ingest plausibility guards (app/mc_ingest.py): all three
  # default ON in code, but without a passthrough line here they can
  # never be turned OFF from .env either -- same known trap as every
  # other setting in this file (compose does not pass .env through
  # wholesale; see ADMIN_REQUIRE_AUTH's own comment above for the full
  # mechanism). See each setting's own comment in app/config.py for
  # exactly what it guards.
  MC_CLOCK_CLAMP_ENABLED: "${MC_CLOCK_CLAMP_ENABLED:-true}"
  MC_CLOCK_CLAMP_SECONDS: "${MC_CLOCK_CLAMP_SECONDS:-3600}"
  MC_SPEED_REJECT_ENABLED: "${MC_SPEED_REJECT_ENABLED:-true}"
  MC_GLITCH_SPEED_MPS: "${MC_GLITCH_SPEED_MPS:-400.0}"
  MC_CELL_CLAIM_CAP_ENABLED: "${MC_CELL_CLAIM_CAP_ENABLED:-true}"
  MC_CELL_CLAIM_CAP: "${MC_CELL_CLAIM_CAP:-500}"
  MC_CELL_CLAIM_CAP_WINDOW_SECONDS: "${MC_CELL_CLAIM_CAP_WINDOW_SECONDS:-3600}"
  # Automatic release of long-abandoned territory (app/mc_ingest.py's
  # hourly sweep, app/mc_scoring.py's find_expired_tiles()/
  # release_tile()). Defaults OFF (MC_TILE_RELEASE_ENABLED=false) and,
  # independently, dry-run ON (MC_TILE_RELEASE_DRY_RUN=true) -- see each
  # setting's own comment in app/config.py. Same passthrough
  # requirement as every other setting in this file.
  MC_TILE_RELEASE_ENABLED: "${MC_TILE_RELEASE_ENABLED:-false}"
  MC_TILE_RELEASE_DRY_RUN: "${MC_TILE_RELEASE_DRY_RUN:-true}"
  MC_TILE_RELEASE_ZERO_HOURS: "${MC_TILE_RELEASE_ZERO_HOURS:-720}"
  MC_TILE_RELEASE_MAX_PER_SWEEP: "${MC_TILE_RELEASE_MAX_PER_SWEEP:-200}"
  MT_POINTS_PER_FEEDER: "${MT_POINTS_PER_FEEDER:-0.1}"
  MT_MAX_POINTS_PER_PING: "${MT_MAX_POINTS_PER_PING:-1.0}"
  CHECKIN_ENABLED: "${CHECKIN_ENABLED:-false}"
  CHECKIN_POINTS: "${CHECKIN_POINTS:-25.0}"
  CHECKIN_NET_START_DATE: "${CHECKIN_NET_START_DATE:-}"
  MC_CHECKIN_BASE_URL: "${MC_CHECKIN_BASE_URL:-}"
  CARTO_API_KEY: "${CARTO_API_KEY:-}"
  # OAuth sign-in (app/oauth.py, app/oauth_api.py). Empty
  # OAUTH_PUBLIC_BASE_URL or either GitHub credential means the
  # provider stays off -- see .env.example for the full contract
  # and where to register the callback URL. Never set real values
  # in this file; it is a public repository.
  OAUTH_PUBLIC_BASE_URL: "${OAUTH_PUBLIC_BASE_URL:-}"
  OAUTH_GITHUB_CLIENT_ID: "${OAUTH_GITHUB_CLIENT_ID:-}"
  OAUTH_GITHUB_CLIENT_SECRET: "${OAUTH_GITHUB_CLIENT_SECRET:-}"
  OAUTH_DISCORD_CLIENT_ID: "${OAUTH_DISCORD_CLIENT_ID:-}"
  OAUTH_DISCORD_CLIENT_SECRET: "${OAUTH_DISCORD_CLIENT_SECRET:-}"
  OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
  OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
  # Email sign-in (magic link) (app/email_login.py, app/oauth_api.py).
  # Empty SMTP_HOST means the feature stays off -- see .env.example
  # for the full contract. Never set real values in this file; it is
  # a public repository.
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-admin@meshwars.com}"
  SMTP_TLS_MODE: "${SMTP_TLS_MODE:-starttls}"
  # TOTP two-factor (app/totp.py): the Fernet key the shared secret is
  # encrypted with at rest. It lives in the environment, never in the
  # database, so a stolen database file alone yields no working second
  # factors. Empty means TOTP enrollment refuses outright rather than
  # ever storing a secret in the clear -- app/totp_api.py fails closed.
  # Generate with:
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  ACCOUNT_TOTP_ENCRYPTION_KEY: "${ACCOUNT_TOTP_ENCRYPTION_KEY:-}"
  # FreqMapper (app/freqmapper_ingest.py): alternative Meshtastic
  # paint source to meshview's own position-packet feed above. See
  # MT_PAINT_SOURCE below for which one actually paints the board.
  FREQMAPPER_ENABLED: "${FREQMAPPER_ENABLED:-false}"
  FREQMAPPER_BASE_URL: "${FREQMAPPER_BASE_URL:-https://dev.freqmapper.net:8443}"
  FREQMAPPER_API_KEY: "${FREQMAPPER_API_KEY:-}"
  FREQMAPPER_POLL_INTERVAL_SECONDS: "${FREQMAPPER_POLL_INTERVAL_SECONDS:-60}"
  FREQMAPPER_PAGE_LIMIT: "${FREQMAPPER_PAGE_LIMIT:-200}"
  FREQMAPPER_POINTS_PER_EVENT: "${FREQMAPPER_POINTS_PER_EVENT:-0.5}"
  FREQMAPPER_UNIQUE_PAINTER_BONUS: "${FREQMAPPER_UNIQUE_PAINTER_BONUS:-0.5}"
  # Which upstream source paints the Meshtastic board: "meshview"
  # (default) or "freqmapper". Exactly one paints at a time -- see
  # this setting's own comment in app/config.py.
  MT_PAINT_SOURCE: "${MT_PAINT_SOURCE:-meshview}"
  # Discord announcements (app/discord_notify.py): end-of-month
  # honors posted to a Discord channel webhook. NOT the same as
  # OAUTH_DISCORD_CLIENT_ID/SECRET above (a player sign-in provider)
  # -- this is a separate credential for a separate feature. Empty
  # means off, never open, same contract as every other optional
  # credential in this file. Compose does not pass .env through
  # wholesale, so this line is what actually gets the value from
  # .env into the container -- see .env.example for how to create
  # the webhook. Never set a real value in this file; it is a public
  # repository.
  DISCORD_WEBHOOK_ANNOUNCEMENTS: "${DISCORD_WEBHOOK_ANNOUNCEMENTS:-}"
  # Display name a Discord announcement posts under -- overrides
  # whatever name the webhook itself was created with in Discord.
  # Not a secret. Falls back to "MeshWars" if left blank (see that
  # setting's own comment in app/config.py).
  DISCORD_WEBHOOK_USERNAME: "${DISCORD_WEBHOOK_USERNAME:-}"
  # Per-team coloured-dot custom emoji for an announcement -- empty
  # means no dots, rendered exactly as before this setting existed.
  # See .env.example for how an operator gets these tokens from
  # their own Discord server. Compose does not pass .env through
  # wholesale, so -- same trap as DISCORD_WEBHOOK_ANNOUNCEMENTS above
  # -- a missing line here means the value sits correctly in .env
  # and silently never reaches the app.
  DISCORD_TEAM_EMOJI: "${DISCORD_TEAM_EMOJI:-}"
  # Discord ROLE sync (app/discord_bot.py) -- a THIRD, separate
  # Discord integration: a real bot user ("Herald") in the guild,
  # authenticated by this token, that assigns/removes team roles on
  # guild members. NOT a webhook URL and NOT the OAUTH_DISCORD_*
  # sign-in credential above. A SECRET, same "empty means off,
  # never logged, never returned by any route" treatment as
  # ACCOUNT_TOTP_ENCRYPTION_KEY -- see .env.example for where to get
  # one. THE KNOWN TRAP: compose does not pass .env through
  # wholesale, so a missing line here means a real token sitting in
  # .env silently never reaches the container and role sync just
  # never does anything, with no error anywhere obvious. Never set a
  # real value in this file; it is a public repository.
  DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
  # The Discord guild (server) id role sync operates in. Not a
  # secret (visible to anyone in the server), but still needs this
  # forwarding line for the same reason DISCORD_TEAM_EMOJI does --
  # this is only the one-time SEED for discord_config.guild_id (see
  # that setting's own comment in app/config.py); an operator edits
  # the live value afterward through /api/admin/discord.
  DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
  # Slash commands (app/discord_interactions.py) -- a FOURTH,
  # separate Discord integration: an HTTPS endpoint Discord POSTs
  # each /command invocation to directly, no bot gateway connection.
  # Neither value is a secret (both are shown on the application's
  # own General Information page in Discord's developer portal) --
  # this is only the one-time SEED for discord_config.app_id/
  # public_key; an operator edits the live values afterward through
  # /api/admin/discord. Same forwarding-line trap as every other
  # Discord setting above: compose does not pass .env through
  # wholesale, so a missing line here means a value sitting in .env
  # silently never reaches the container.
  DISCORD_APP_ID: "${DISCORD_APP_ID:-}"
  DISCORD_PUBLIC_KEY: "${DISCORD_PUBLIC_KEY:-}"

x-meshwars-volumes: &meshwars-volumes
  # The game database, in a directory beside this compose file. A
  # plain directory rather than a named volume so the operator can
  # see, back up and move their own data with ordinary tools -- and,
  # with the non-root `user:` above, without sudo. It must be owned
  # by the uid the container runs as (1000:1000 by default); an
  # install migrating off the old root-owned layout does that once
  # with `chown -R 1000:1000 ./data`. SQLite needs write permission
  # on the DIRECTORY, not just game.db, to create its -wal and -shm
  # sidecars.
  #
  # Shared, byte-for-byte, between meshwars and meshwars-worker below
  # -- both services mount the exact same ./data/data:/data, which is
  # what lets the web role's POST /api/mc/ingest durably enqueue a row
  # (app/mc_ingest.py's McIngestor.submit(), into mc_ingest_queue) that
  # the worker role's own queue-drain loop, running in a different
  # container, then picks up from the same game.db file.
  #
  # The Places Worth Going seed also lives here (2026-09-08, moved
  # out of the git-tracked app/reference/ -- see app/config.py's
  # places_seed_path and docs/features/places.md): drop
  # places_worth_going.csv.gz (or the decompressed .csv) at
  # ./data/data/places_worth_going.csv.gz, no separate mount needed.
  # Without it the app starts fine but with zero places -- see
  # app/places_seed.py's missing-file log line. Only meshwars-worker
  # actually loads it (RUN_BACKGROUND_TASKS=true gates that thread --
  # see app/db.py's init_db()), but both services need the mount
  # present regardless, since both read from `place`/`place_cell`.
  - ./data/data:/data
  # Terrain/overlay PMTiles archives (hillshade, public lands, USFS
  # roads and trails) the map serves from /tiles. Large (hundreds of
  # MB to GB each), static, and copied in from outside docker (see
  # docs/), so a directory rather than a volume: they survive an
  # image rebuild and a `docker compose down -v` without being
  # re-copied. Read-only from the container's side -- the app only
  # ever serves these, never writes them, so the mount needs no
  # particular ownership. Optional: with the directory empty or
  # absent, app/api.py's /tiles mount simply doesn't appear and the
  # map draws without those overlays. meshwars-worker never actually
  # serves /tiles (nothing routes to its unpublished port), but it
  # costs nothing to mount identically rather than special-case it.
  - ./data/tiles:/tiles-data:ro

services:
  meshwars:
    build: .
    image: meshwars:latest
    restart: unless-stopped
    # Run the container as an ordinary account instead of root. The
    # Dockerfile already switches to its own unprivileged `meshwars`
    # user (uid/gid 1000); this line exists so an operator whose own
    # account is a different uid can line the container up with it
    # without rebuilding the image -- set PUID/PGID in .env to the
    # output of `id -u` / `id -g`. It must match whoever owns ./data on
    # the host, or the app cannot write the database.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8090:8090"
    # Web role: HTTP only, N uvicorn worker PROCESSES behind the one
    # published port -- see the file header comment above. Overrides
    # the Dockerfile's default CMD (which runs a single process, no
    # --workers, the right default for meshwars-worker below) only to
    # add --workers 3; otherwise identical, including the
    # FORWARDED_ALLOW_IPS substitution and the exec so uvicorn keeps
    # getting SIGTERM directly rather than a wrapping shell eating it.
    command: ["/bin/sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8090 --workers 3 --proxy-headers --forwarded-allow-ips \"$FORWARDED_ALLOW_IPS\""]
    # MEMORY SIZING -- CT 119, the Proxmox container both services
    # deploy into, has 4.0 GiB TOTAL. This compose file carried NO
    # mem_limit on any service before this web/worker split -- 2g here
    # and 1g on meshwars-worker below are NEW ceilings, not raised
    # ones. 2g + 1g = 3g, leaving ~1g of headroom for the container's
    # own OS on top of both services. 2g covers all THREE --workers
    # processes above combined (mem_limit applies to the whole
    # service, not per-process) -- see app/db.py's _POOL_MAX comment
    # for how the SQLite connection pool's own per-process memory
    # ceiling was resized against this same budget.
    mem_limit: 2g
    environment:
      <<: *meshwars-environment
      # Web role: no background loops, no startup writes -- see
      # app/config.py's run_background_tasks and the file header
      # comment above.
      RUN_BACKGROUND_TASKS: "false"
    volumes: *meshwars-volumes

  meshwars-worker:
    build: .
    image: meshwars:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # No published port -- see the file header comment above. Runs the
    # Dockerfile's default CMD unmodified (no --workers override), so
    # this is exactly ONE process, the invariant the whole split
    # depends on: every background loop and every startup write must
    # have exactly one owner fleet-wide, and RUN_BACKGROUND_TASKS=true
    # below only makes that owner true for THIS container -- it says
    # nothing about how many processes are inside it, which is what
    # the missing --workers here actually guarantees.
    mem_limit: 1g
    environment:
      <<: *meshwars-environment
      # Worker role: the one process fleet-wide that owns every
      # background loop (ingest, mc_ingest's queue-drain worker,
      # freqmapper_ingest, the checkin poller, the mqtt subscriber,
      # the Discord outbox drain loop) and performs init_db()'s
      # startup writes (places-seed thread, checkin/freqmapper/discord
      # config bootstraps) -- see app/config.py's run_background_tasks.
      RUN_BACKGROUND_TASKS: "true"
    volumes: *meshwars-volumes

volumes:
  # Kept only so an existing install's database is not orphaned by the
  # move to ./data above: nothing mounts this any more, but declaring it
  # here means `docker compose down -v` on an upgraded install still
  # knows about the volume the data used to live in, and the volume is
  # not silently left behind under a name compose no longer recognises.
  # Remove this once every deployment has migrated its data out.
  meshwars-data:
