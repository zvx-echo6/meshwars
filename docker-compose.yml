services:
  meshwars:
    build: .
    image: meshwars:latest
    restart: unless-stopped
    # Run the container as an ordinary account instead of root. The
    # Dockerfile already switches to its own unprivileged `meshwars`
    # user (uid/gid 1000); this line exists so an operator whose own
    # account is a different uid can line the container up with it
    # without rebuilding the image -- set PUID/PGID in .env to the
    # output of `id -u` / `id -g`. It must match whoever owns ./data on
    # the host, or the app cannot write the database.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8090:8090"
    environment:
      # Required: point this at any meshview instance
      MESHVIEW_BASE_URL: "${MESHVIEW_BASE_URL}"
      # Optional overrides
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-45}"
      SEASON_DAYS: "${SEASON_DAYS:-180}"
      WINNER_BANNER_HOURS: "${WINNER_BANNER_HOURS:-72}"
      HISTORY_MAX: "${HISTORY_MAX:-12}"
      MAX_HOPS: "${MAX_HOPS:-0}"
      BACKFILL_HOURS: "${BACKFILL_HOURS:-24}"
      PLAY_AREA_NORTH: "${PLAY_AREA_NORTH:-44.10}"
      PLAY_AREA_SOUTH: "${PLAY_AREA_SOUTH:-40.20}"
      PLAY_AREA_WEST: "${PLAY_AREA_WEST:--117.00}"
      PLAY_AREA_EAST: "${PLAY_AREA_EAST:--111.60}"
      JOIN_INVITE_CODE: "${JOIN_INVITE_CODE:-}"
      JOIN_INVITE_CODE_PUBLIC: "${JOIN_INVITE_CODE_PUBLIC:-false}"
      JOIN_RATE_LIMIT_ATTEMPTS: "${JOIN_RATE_LIMIT_ATTEMPTS:-5}"
      JOIN_RATE_LIMIT_WINDOW_SECONDS: "${JOIN_RATE_LIMIT_WINDOW_SECONDS:-600}"
      JOIN_MESHTASTIC_ENABLED: "${JOIN_MESHTASTIC_ENABLED:-false}"
      PUBLIC_HOST: "${PUBLIC_HOST:-meshwars.com}"
      GOOGLE_SITE_VERIFICATION: "${GOOGLE_SITE_VERIFICATION:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MC_RAW_LOG_ENABLED: "${MC_RAW_LOG_ENABLED:-false}"
      MC_RAW_LOG_PATH: "${MC_RAW_LOG_PATH:-/data/mc_raw.log}"
      MT_POINTS_PER_FEEDER: "${MT_POINTS_PER_FEEDER:-0.1}"
      MT_MAX_POINTS_PER_PING: "${MT_MAX_POINTS_PER_PING:-1.0}"
      CHECKIN_ENABLED: "${CHECKIN_ENABLED:-false}"
      CHECKIN_POINTS: "${CHECKIN_POINTS:-25.0}"
      CHECKIN_NET_START_DATE: "${CHECKIN_NET_START_DATE:-}"
      MC_CHECKIN_BASE_URL: "${MC_CHECKIN_BASE_URL:-}"
      CARTO_API_KEY: "${CARTO_API_KEY:-}"
    volumes:
      # The game database, in a directory beside this compose file. A
      # plain directory rather than a named volume so the operator can
      # see, back up and move their own data with ordinary tools -- and,
      # with the non-root `user:` above, without sudo. It must be owned
      # by the uid the container runs as (1000:1000 by default); an
      # install migrating off the old root-owned layout does that once
      # with `chown -R 1000:1000 ./data`. SQLite needs write permission
      # on the DIRECTORY, not just game.db, to create its -wal and -shm
      # sidecars.
      - ./data/data:/data
      # Terrain/overlay PMTiles archives (hillshade, public lands, USFS
      # roads and trails) the map serves from /tiles. Large (hundreds of
      # MB to GB each), static, and copied in from outside docker (see
      # docs/), so a directory rather than a volume: they survive an
      # image rebuild and a `docker compose down -v` without being
      # re-copied. Read-only from the container's side -- the app only
      # ever serves these, never writes them, so the mount needs no
      # particular ownership. Optional: with the directory empty or
      # absent, app/api.py's /tiles mount simply doesn't appear and the
      # map draws without those overlays.
      - ./data/tiles:/tiles-data:ro

volumes:
  # Kept only so an existing install's database is not orphaned by the
  # move to ./data above: nothing mounts this any more, but declaring it
  # here means `docker compose down -v` on an upgraded install still
  # knows about the volume the data used to live in, and the volume is
  # not silently left behind under a name compose no longer recognises.
  # Remove this once every deployment has migrated its data out.
  meshwars-data:
